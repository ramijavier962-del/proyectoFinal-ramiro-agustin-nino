<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Iniciar sesión | Los Pichulos</title>
        <link rel="icon" href="img/pichulos venta de stock.png">
        <link rel="stylesheet" href="Css/app.css">
    </head>
    <body class="auth-body">
        <main class="auth-card">
            <img class="auth-logo" src="img/pichulita.png" alt="Los Pichulos">
            <p class="eyebrow">SISTEMA DE GESTIÓN</p>
            <h1>Bienvenido a Los Pichulos</h1>
            <p class="muted">Ingresá para administrar tu tienda.</p>
            <form id="loginForm">
                <label>
                    Correo electrónico
                    <input id="email" type="email" required autocomplete="username" placeholder="tu@correo.com">
                </label>
                <label>
                    Contraseña
                    <input id="password" type="password" required autocomplete="current-password" placeholder="Tu contraseña">
                </label>
                <button class="btn" type="submit">Iniciar sesión</button>
                <p id="loginMessage" class="form-message"></p>
            </form>
            <p class="muted small">Acceso de demostración: adminLospichulos@gmail.com · 123456</p>
        </main>
        <script src="Js/app.js"></script>
    </body>
</html>
