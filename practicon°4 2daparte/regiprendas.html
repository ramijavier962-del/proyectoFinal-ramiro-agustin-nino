</head>

<body>

<video autoplay muted loop id="video-fondo">
      <source src="video/video mano ropa.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>
  <nav class="sidebar">

    <header class="logo">
<img src="img/pichulita.png" alt="imagen logo">

      <h1>lospichulos</h1>
      <p>Stock de ropa</p>
    </header>

    <ul class="menu">
      <a href="indexx.html"><li>Inicio</li></a>
      <a href="ventas.html"><li> Registrar venta</li></a>

  <main class="main">

    <header class="top">
      <h2>Panel principal</h2>

    </header>



    <section class="table-box">


      <header>
        <h3>Registrar nueva prenda</h3>
      </header>
      <br>
      <form>

<!-- el placeholder  sirve para colocar el ajemplo atras de lo que se ingresa -->
        <label>Nombre de la prenda</label>
        <input type="text"
      
        placeholder="Ej:  Pantalones"
        required>
        
        <label>Cantidad</label>
        <input type="number"
        placeholder="Ej: 10"
        required>

        <label>Talles</label>
        <input type="text"
        placeholder="Ej: M"
        required>

        <label>Marca</label>
        <input type="text"
        placeholder="Ej: Ñike,crico"
        required>

        <label>Precio Unitario</label>
        <input type="number"
        placeholder="Ej: 15000"
        required>




        <button class="btn" type="submit">
          Guardar prendas
        </button>


      </form>


    </section>

  </main>

</body>
</html>
